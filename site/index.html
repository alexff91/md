<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown — online editor with live preview, tables and export</title>
<meta name="description" content="Write Markdown and see the result as you type: tables, task lists, code, quotes. Save as .md or .html, copy HTML, print to PDF. Nothing is uploaded.">
<meta name="robots" content="index, follow">
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#15181d; --soft:#646c7a; --line:#e3e6ec;
    --accent:#3730a3; --accent-soft:#eceafb; --r:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1180px; margin:0 auto; padding:28px 18px 80px; }
  h1 { font-size:clamp(23px,4.5vw,30px); letter-spacing:-.5px; margin:0; }
  .lede { color:var(--soft); margin:8px 0 22px; max-width:62ch; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .langs { display:flex; gap:4px; padding:3px; background:#fff; border:1px solid var(--line);
    border-radius:999px; flex:none; }
  .langs button { font:inherit; font-size:13px; font-weight:700; letter-spacing:.03em;
    padding:5px 12px; border-radius:999px; background:transparent; color:var(--soft);
    border:0; cursor:pointer; }
  .langs button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px; margin-bottom:16px; }
  button { font:inherit; font-weight:600; border:0; border-radius:9px; padding:9px 14px;
    background:var(--accent); color:#fff; cursor:pointer; }
  button:hover:not(:disabled) { background:#2c2685; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  button.ghost:hover:not(:disabled) { border-color:var(--accent); background:#fff; }

  /* Верхняя полоса: переключатель вида и файловые кнопки. На телефоне
     обе группы прокручиваются по горизонтали, а не ломают строку. */
  .top { display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
  .views { display:flex; gap:2px; padding:3px; background:var(--bg); border-radius:10px; flex:none; }
  .views button { background:transparent; color:var(--soft); padding:7px 12px; font-size:14px; }
  .views button:hover:not(:disabled) { background:transparent; color:var(--ink); }
  .views button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .files { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .files::-webkit-scrollbar { display:none; }
  .files button { flex:none; font-size:14px; padding:8px 12px; }

  .toolbar { display:flex; gap:6px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
  .toolbar::-webkit-scrollbar { display:none; }
  .toolbar button { flex:none; background:#fff; color:var(--ink); border:1px solid var(--line);
    font-size:13.5px; padding:7px 11px; border-radius:8px; font-weight:600; }
  .toolbar button:hover:not(:disabled) { background:var(--accent-soft); border-color:var(--accent); }
  .toolbar .sep { width:1px; background:var(--line); margin:4px 4px; flex:none; }

  /* Две колонки. Высота от окна, чтобы редактор и превью прокручивались
     каждый сам по себе, а не страница целиком. */
  .panes { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px;
    height:calc(100vh - 300px); min-height:420px; }
  .panes[data-view="write"] { grid-template-columns:1fr; }
  .panes[data-view="write"] .preview { display:none; }
  .panes[data-view="preview"] { grid-template-columns:1fr; }
  .panes[data-view="preview"] .editor { display:none; }
  .editor { width:100%; height:100%; resize:none; border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; font:15px/1.6 var(--mono); color:var(--ink); background:#fff;
    tab-size:2; -moz-tab-size:2; }
  .editor:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
  /* .md центрирует статью через margin:auto — в гриде это выключает
     растяжение, и превью вылезало бы за свою колонку. Тут ширина от колонки. */
  .preview.md { height:100%; overflow:auto; border:1px solid var(--line); border-radius:10px;
    padding:18px 22px; background:#fff; max-width:none; margin:0; width:100%; min-width:0; }
  .drag .editor { border-color:var(--accent); background:var(--accent-soft); }

  .bottom { display:flex; justify-content:space-between; gap:10px; margin-top:10px;
    font-size:13px; color:var(--soft); flex-wrap:wrap; }
  .status { min-height:20px; }
  .status.ok { color:#1a7f37; }
  .status.bad { color:#b3261e; }

  .note { background:var(--accent-soft); border-radius:10px; padding:13px 15px;
    font-size:14.5px; line-height:1.55; margin-top:12px; }
  footer { color:var(--soft); font-size:14px; border-top:1px solid var(--line);
    margin-top:30px; padding-top:18px; max-width:70ch; }
  footer .lic { font-size:12.5px; margin-top:8px; }
  .hidden { display:none !important; }

  @media (max-width:899px) {
    .wrap { padding:18px 12px 60px; }
    .card { padding:10px; }
    .panes { grid-template-columns:1fr !important; height:auto; min-height:0; }
    .editor, .preview { height:62vh; min-height:340px; }
    .views .split { display:none; }
    .langs button, .files button, .views button, .toolbar button { min-height:44px; }
    .editor { font-size:16px; }
  }

  /* Печать: только сама страница, без редактора и кнопок. Так «печать в
     PDF» становится экспортом, для которого не нужна ни одна библиотека. */
  @media print {
    body { background:#fff; }
    .wrap { max-width:none; padding:0; }
    .head, .lede, .top, .toolbar, .bottom, .note, footer, .family, .editor { display:none !important; }
    .card { border:0; padding:0; margin:0; }
    .panes { display:block; height:auto; min-height:0; }
    .preview { display:block !important; height:auto; overflow:visible; border:0; padding:0; }
  }
</style>
<!-- Оформление превью. Отдельным тегом, потому что этот же текст уезжает
     внутрь сохранённого .html: у экспорта и у экрана один источник стиля. -->
<style id="mdStyle">
  .md { font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#15181d; max-width:76ch; margin:0 auto; word-wrap:break-word; }
  .md > :first-child { margin-top:0; }
  .md h1, .md h2, .md h3, .md h4 { line-height:1.25; letter-spacing:-.2px; margin:1.4em 0 .5em; }
  .md h1 { font-size:1.9em; } .md h2 { font-size:1.45em; border-bottom:1px solid #e3e6ec; padding-bottom:.25em; }
  .md h3 { font-size:1.2em; } .md h4 { font-size:1.05em; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin:0 0 1em; }
  .md a { color:#3730a3; }
  .md code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9em; background:#f1f2f5; padding:.15em .4em; border-radius:5px; }
  .md pre { background:#f1f2f5; padding:12px 14px; border-radius:8px; overflow-x:auto; line-height:1.5; }
  .md pre code { background:none; padding:0; font-size:.88em; }
  .md blockquote { border-left:3px solid #c9cdd6; margin-left:0; padding:.2em 0 .2em 1em; color:#4a525f; }
  .md ul, .md ol { padding-left:1.6em; }
  .md li + li { margin-top:.2em; }
  .md li.task { list-style:none; margin-left:-1.5em; }
  .md li.task input { margin-right:.5em; vertical-align:-.1em; }
  .md img { max-width:100%; height:auto; }
  .md hr { border:0; border-top:1px solid #e3e6ec; margin:1.6em 0; }
  .md .tablewrap { overflow-x:auto; margin:0 0 1em; }
  .md table { border-collapse:collapse; width:auto; min-width:50%; font-size:.95em; margin:0; }
  .md th, .md td { border:1px solid #d9dde5; padding:.45em .8em; vertical-align:top; }
  .md th { background:#f1f2f5; font-weight:600; text-align:left; }
  .md tbody tr:nth-child(even) { background:#fafbfc; }
  .md .empty { color:#8a919e; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1 data-i18n="h1">Markdown</h1>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" id="langEn" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" id="langRu" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </div>
  <p class="lede" data-i18n="lede"></p>

  <div class="card work">
    <div class="top">
      <div class="views" role="group" id="views">
        <button type="button" data-view="write" data-i18n="viewWrite" aria-pressed="false"></button>
        <button type="button" data-view="preview" data-i18n="viewPreview" aria-pressed="false"></button>
        <button type="button" class="split" data-view="split" data-i18n="viewSplit" aria-pressed="false"></button>
      </div>
      <div class="files">
        <button type="button" class="ghost" id="open" data-i18n="open"></button>
        <button type="button" id="saveMd" data-i18n="saveMd"></button>
        <button type="button" class="ghost" id="saveHtml" data-i18n="saveHtml"></button>
        <button type="button" class="ghost" id="copyHtml" data-i18n="copyHtml"></button>
        <button type="button" class="ghost" id="print" data-i18n="print"></button>
        <button type="button" class="ghost" id="clear" data-i18n="clear"></button>
      </div>
      <input type="file" id="file" class="hidden" accept=".md,.markdown,.txt,text/markdown,text/plain">
    </div>

    <div class="toolbar" id="toolbar">
      <button type="button" data-act="bold" data-i18n="tbBold"></button>
      <button type="button" data-act="italic" data-i18n="tbItalic"></button>
      <button type="button" data-act="heading" data-i18n="tbHeading"></button>
      <button type="button" data-act="link" data-i18n="tbLink"></button>
      <button type="button" data-act="code" data-i18n="tbCode"></button>
      <span class="sep"></span>
      <button type="button" data-act="quote" data-i18n="tbQuote"></button>
      <button type="button" data-act="list" data-i18n="tbList"></button>
      <button type="button" data-act="numbered" data-i18n="tbNumbered"></button>
      <button type="button" data-act="task" data-i18n="tbTask"></button>
      <span class="sep"></span>
      <button type="button" data-act="table" data-i18n="tbTable"></button>
      <button type="button" data-act="tidy" data-i18n="tbTidy"></button>
      <button type="button" data-act="rule" data-i18n="tbRule"></button>
    </div>

    <div class="panes" id="panes" data-view="split">
      <textarea class="editor" id="editor" spellcheck="true" autocapitalize="off" autocomplete="off"></textarea>
      <div class="preview md" id="preview"></div>
    </div>

    <div class="bottom">
      <span id="stats"></span>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="note" data-i18n="privacy"></div>

  <footer>
    <p data-i18n="footer"></p>
    <p class="lic">Parsing: <a href="https://github.com/markedjs/marked" target="_blank" rel="noopener">marked</a> 15.0.12, MIT. Sanitising: <a href="https://github.com/cure53/DOMPurify" target="_blank" rel="noopener">DOMPurify</a> 3.2.6, Apache-2.0 / MPL-2.0. Both used unmodified.</p>
  </footer>

</div>

<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
